# Portal Scanner Configuration — William León (QA/QC Engineer)
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- QA / QC core roles --
    - "QA Engineer"
    - "QC Engineer"
    - "Quality Assurance"
    - "Quality Control"
    - "Quality Engineer"
    - "QA Automation"
    - "Test Automation"
    - "Automation Engineer"
    - "Automation Tester"
    - "SDET"
    - "Software Development Engineer in Test"
    - "Software Developer in Test"
    - "QA Lead"
    - "QA Manager"
    - "QA Analyst"
    - "Test Engineer"
    - "Test Lead"
    - "Testing Engineer"
    # -- Integration / Validation --
    - "Integration Engineer"
    - "Validation Engineer"
    - "QC Integration"
    - "QA Integration"
    # -- Spanish-language equivalents --
    - "Ingeniero QA"
    - "Ingeniero de Calidad"
    - "Automatización de Pruebas"
    - "Tester"
    - "Analista QA"
  negative:
    - "Junior"
    - "Intern"
    - "Entry Level"
    - "Entry-Level"
    - "Trainee"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "SAP "
    - "Mainframe"
    - "COBOL"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Mid"
    - "Middle"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.

search_queries:
  # -- Ashby --
  - name: Ashby — QA Automation Senior
    query: 'site:jobs.ashbyhq.com "QA Engineer" OR "SDET" OR "Test Automation" OR "Automation Engineer" remote senior'
    enabled: true

  - name: Ashby — QC Integration
    query: 'site:jobs.ashbyhq.com "QC Engineer" OR "Integration Engineer" OR "Validation Engineer" remote'
    enabled: true

  # -- Greenhouse --
  - name: Greenhouse — QA Automation
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "QA Engineer" OR "SDET" OR "Test Automation" remote senior'
    enabled: true

  - name: Greenhouse — QA Lead
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "QA Lead" OR "QA Manager" OR "Quality Lead" remote'
    enabled: true

  - name: Greenhouse — QC Integration
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "QC Engineer" OR "Integration Engineer" OR "Validation" biometric OR identity OR government'
    enabled: true

  # -- Lever --
  - name: Lever — QA Senior Remote
    query: 'site:jobs.lever.co "QA Engineer" OR "SDET" OR "Test Automation" OR "Automation Engineer" remote senior'
    enabled: true

  # -- Remote boards --
  - name: RemoteOK — QA Senior
    query: 'site:remoteok.com "QA Engineer" OR "SDET" OR "Test Automation" OR "Automation Engineer" senior'
    enabled: true

  - name: WeWorkRemotely — QA
    query: 'site:weworkremotely.com "QA" OR "Quality Assurance" OR "Test Automation" OR "SDET" senior'
    enabled: true

  - name: Working Nomads — QA Remote
    query: 'site:workingnomads.com "QA Engineer" OR "SDET" OR "Test Automation" senior remote'
    enabled: true

  - name: Himalayas — QA Remote
    query: 'site:himalayas.app "QA Engineer" OR "SDET" OR "Test Automation" OR "Automation Engineer" senior remote'
    enabled: true

  - name: Remotive — QA Senior
    query: 'site:remotive.com "QA" OR "Quality Assurance" OR "Test Automation" OR "SDET" senior remote'
    enabled: true

  # -- Latin America & Colombia --
  - name: Computrabajo — QA Colombia
    query: 'site:computrabajo.com.co "QA" OR "Quality Assurance" OR "Automatización" OR "SDET" remoto senior'
    enabled: true

  - name: LinkedIn — QA Remote Latam
    query: '"QA Engineer" OR "SDET" OR "Test Automation" OR "Automation Engineer" remote Colombia OR Latam OR "Latin America" senior -junior'
    enabled: true

  - name: LinkedIn — QA Identity Biometric
    query: '"QA Engineer" OR "QC Engineer" biometric OR "identity document" OR passport OR "national ID" remote -junior'
    enabled: true

  # -- YC / Startups --
  - name: YC Jobs — QA/SDET
    query: 'site:workatastartup.com "QA" OR "SDET" OR "Test Automation" OR "Automation Engineer" remote'
    enabled: true

  # -- General job boards --
  - name: Indeed — QA Remote Senior
    query: 'site:indeed.com "Senior QA Engineer" OR "SDET" OR "Senior Test Automation" remote -junior'
    enabled: true

