# Portal Scanner Configuration — William León (QA/QC Engineer)
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- QA / QC core roles --
    - "QA Engineer"
    - "QC Engineer"
    - "Quality Assurance"
    - "Quality Control"
    - "Quality Engineer"
    - "QA Automation"
    - "Test Automation"
    - "Automation Engineer"
    - "Automation Tester"
    - "SDET"
    - "Software Development Engineer in Test"
    - "Software Developer in Test"
    - "QA Lead"
    - "QA Manager"
    - "QA Analyst"
    - "Test Engineer"
    - "Test Lead"
    - "Testing Engineer"
    # -- Integration / Validation --
    - "Integration Engineer"
    - "Validation Engineer"
    - "QC Integration"
    - "QA Integration"
    # -- Spanish-language equivalents --
    - "Ingeniero QA"
    - "Ingeniero de Calidad"
    - "Automatización de Pruebas"
    - "Tester"
    - "Analista QA"
  negative:
    - "Junior"
    - "Intern"
    - "Entry Level"
    - "Entry-Level"
    - "Trainee"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "SAP "
    - "Mainframe"
    - "COBOL"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Mid"
    - "Middle"

# -- Location filter (added 2026-07-29) --
# Keeps only Colombia / LATAM-remote roles. Rules (see modes/scan.md step 6b):
#   empty posting location -> passes; any `block` keyword -> reject (wins over allow);
#   non-empty `allow` -> must match >=1 keyword. All case-insensitive substring matches.
# NOTE: scan.mjs v1.10 does NOT enforce this yet (it captures location but ignores the
# filter). Enforced by the agent workflow now; the v1.21 update is expected to add native
# scanner support. Country-only shards (Mexico/Brazil/etc.) are dropped by the allow-list
# requirement; multi-country LATAM postings that mention Colombia still pass.
location_filter:
  allow:
    - "Colombia"
    - "Bogotá"
    - "Bogota"
    - "Medellín"
    - "Medellin"
    - "LATAM"
    - "Latin America"
    - "Latam"
    - "Americas"
    - "Remote"
    - "Anywhere"
    - "Worldwide"
    - "Global"
  block:
    - "India"
    - "Philippines"
    - "Manila"
    - "Quezon"
    - "Pakistan"
    - "Vietnam"
    - "Indonesia"
    - "Europe"
    - "European"
    - "EMEA"
    - "Egypt"
    - "Nigeria"
    - "Kenya"
    - "Ukraine"
    - "Poland"
    - "Romania"

# -- Search queries --
