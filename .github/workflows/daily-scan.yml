name: Daily Job Scan

on:
  schedule:
    - cron: '0 13 * * *'  # 8:00 AM COT (UTC-5)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run zero-LLM API scanner
        run: node scan.mjs

      - name: Commit scan results
        run: |
          git config user.name "career-ops[bot]"
          git config user.email "career-ops@noreply.github.com"
          git add data/pipeline.md data/scan-history.tsv
          git diff --staged --quiet && echo "No new offers found." || (
            git commit -m "chore: daily scan $(date +%Y-%m-%d)" &&
            git push
          )
